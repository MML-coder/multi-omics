name: Schema drift decision
description: A source sent a column its contract does not map (SchemaDriftDetected F006). Decide adopt / ignore / forbid.
title: "[schema drift] <source>.<column>"
labels: ["schema-drift"]
body:
  - type: input
    id: source
    attributes:
      label: Source
      placeholder: lab_a
    validations:
      required: true
  - type: input
    id: column
    attributes:
      label: Column
      placeholder: specimen_type
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Output of `pipeline drift` and `pipeline events`, and what the vendor says the column contains.
  - type: dropdown
    id: decision
    attributes:
      label: Decision
      options:
        - Adopt (map it; needs an ADR if a new canonical field is required, then replay)
        - Ignore (add to ignored_columns)
        - Forbid (add to forbidden_columns; involve security if the data is sensitive)
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
    validations:
      required: true
