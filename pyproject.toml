[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omics-pipeline"
version = "0.1.0"
description = "Ingest, validate, normalize and expose multi-source measurement data with provenance"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==1.5.6",
    "PyYAML==6.0.3",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]
ui = [
    "streamlit==1.65.0",
]

[project.scripts]
pipeline = "omics_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
